name: Publish Pages

on:
  push:
    branches:
      - main
    paths:
      - 'static/**'
      - '.github/workflows/publish-pages.yml'
  workflow_run:
    workflows:
      - Publish Firmware
    types:
      - completed
  pull_request:
    paths:
      - 'static/**'
      - '.github/workflows/publish-pages.yml'
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - run: mkdir -p output/firmware

      - name: Build
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./static
          destination: ./output

      - name: Fetch firmware files
        env:
          GH_TOKEN: ${{ github.token }}
        # Download from the newest release that actually has assets — the
        # latest release briefly has none while its firmware is still building
        run: |
          tag=$(gh api "repos/${{ github.repository }}/releases" \
            --jq '[.[] | select(.draft == false and .prerelease == false and (.assets | length) > 0)][0].tag_name')
          if [ -z "$tag" ]; then
            echo "No release with assets found" >&2
            exit 1
          fi
          echo "Downloading firmware assets from release $tag"
          gh release download "$tag" --repo "${{ github.repository }}" --pattern '*' --dir output/firmware

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: output
          retention-days: 1

  publish:
    if: github.event_name != 'pull_request'
    name: Publish
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
