substitutions:
  device_name: cwa-weather-panel
  friendly_name: CWA Weather Panel
  project_website: https://github.com/parkghost/cwa-weather-panel
  firmware_manifest_url: https://parkghost.github.io/cwa-weather-panel/firmware/cwa-weather-panel.manifest.json
  timezone: Asia/Taipei
  wifi_ap_password: !secret wifi_ap_password
  display_model: depg0420
  display_rotation: "0"
  display_update_interval: never
  display_full_update_every: "10"
  highlight_color: RED
  default_schedule_reboot_time: "05:00:00"

external_components:
  - source: github://parkghost/esphome-epaper
    components: [waveshare_epaper]

  - source: github://parkghost/esphome-cwa-town-forecast
    components: [cwa_town_forecast]

logger:
  level: DEBUG
  # baud_rate: 0

packages:
  board: !include boards/esp32s3/waveshare_esp32_s3_zero_epd_v1.yaml
  device_web: !include templates/device_standalone.yaml
  epd_toolkit: !include common/epd/toolkit.yaml
  epd_toolkit_ext: !include common/epd/toolkit_ext.yaml
  debug: !include common/debug_esp32.yaml
  debug_psram: !include common/debug_psram.yaml

esp32:
  framework:
    type: esp-idf

esphome:
  on_boot:
    then:
      - text_sensor.template.publish:
          id: project_website
          state: "$project_website"
      - text_sensor.template.publish:
          id: firmware_version
          state: !lambda |-
            #ifdef ESPHOME_PROJECT_VERSION
              return {ESPHOME_PROJECT_VERSION};
            #else
              return {"Unknown"};
            #endif

web_server:
  version: 3
  sorting_groups:
    - id: project_group
      name: "Project Information"
      sorting_weight: -10
    - id: forecast_group
      name: "Forecast"
      sorting_weight: -9
    - id: schedule_reboot_group
      name: "Schedule Reboot"
      sorting_weight: -8
    - id: firmware_group
      name: "Firmware"
      sorting_weight: -7

globals:
  - id: initial
    type: bool
    initial_value: "false"

  - id: ota_in_progress
    type: bool
    initial_value: "false"

  - id: ota_start_time
    type: std::string
    initial_value: ""

  - id: day_1_icon
    type: std::string
    initial_value: ""

  - id: day_1_min_temp
    type: std::string
    initial_value: ""

  - id: day_1_max_temp
    type: std::string
    initial_value: ""

  - id: day_1_date
    type: std::string
    initial_value: ""

time:
  - platform: sntp
    id: !extend esp_time
    on_time:
      - cron: "0 0 /3 * * *"
        then:
          - script.execute:
              id: update_forecast_all
              update_display: true

    on_time_sync:
      then:
        - lambda: |-
            if (!id(initial)) {
              id(update_forecast_all)->execute(true);
            }

cwa_town_forecast:
  - id: town_forecast_3d
    api_key: !lambda return id(forecast_api_key).state;
    city_name: !lambda return id(city_name).current_option().str();
    town_name: !lambda return id(town_name).state;
    mode: 3-DAYS
    time_to: 1d
    weather_elements:
      - 天氣現象
      - 3小時降雨機率
    retain_fetched_data: true

  - id: town_forecast_7d
    api_key: !lambda return id(forecast_api_key).state;
    city_name: !lambda return id(city_name).current_option().str();
    town_name: !lambda return id(town_name).state;
    mode: 7-DAYS
    weather_elements:
      - 最高溫度
      - 最低溫度
      - 12小時降雨機率
      - 天氣現象
    retain_fetched_data: true

script:
  - id: validate_and_update_forecast
    then:
      - lambda: |-
          // Validate that all required fields are filled
          if (id(city_name).current_option().empty()) {
            ESP_LOGW("validate", "City name is empty, skipping forecast update");
            return;
          }
          if (id(town_name).state.empty()) {
            ESP_LOGW("validate", "Town name is empty, skipping forecast update");
            return;
          }
          if (id(forecast_api_key).state.empty()) {
            ESP_LOGW("validate", "Forecast API key is empty, skipping forecast update");
            return;
          }

          // Validate API key format (basic check for CWA API key format)
          if (id(forecast_api_key).state.length() < 10) {
            ESP_LOGW("validate", "Forecast API key appears to be invalid (too short), skipping forecast update");
            return;
          }

          ESP_LOGI("validate", "All required fields validated, proceeding with forecast update");

          id(update_forecast_all)->execute(true);

  - id: update_forecast_all
    parameters:
      update_display: bool
    then:
      if:
        condition:
          - time.has_time:
          - wifi.connected:
        then:
          - lambda: |-
              if (!id(city_name).current_option().empty() &&
                  !id(forecast_api_key).state.empty() &&
                  !id(town_name).state.empty()) {
                id(town_forecast_3d).update();
                id(town_forecast_7d).update();
              }

              if (update_display) {
                id(fire_refresh_event)->execute();
              }

  - id: fire_refresh_event
    then:
      - lambda: |-
          ESP_LOGW("main", "Refresh Event fired");
          id(refresh_and_wait).execute("");
      - delay: 200ms

select:
  - platform: template
    id: forecast_mode
    name: Forecast - Mode
    restore_value: true
    options:
      - "7-Day Forecast"
      - "18-Hour Forecast"
    initial_option: "18-Hour Forecast"
    optimistic: true
    web_server:
      sorting_group_id: forecast_group
    on_value:
      - script.execute: fire_refresh_event

  - platform: template
    id: city_name
    name: Forecast - City Name
    restore_value: true
    options:
      - 宜蘭縣
      - 花蓮縣
      - 臺東縣
      - 澎湖縣
      - 金門縣
      - 連江縣
      - 臺北市
      - 新北市
      - 桃園市
      - 臺中市
      - 臺南市
      - 高雄市
      - 基隆市
      - 新竹縣
      - 新竹市
      - 苗栗縣
      - 彰化縣
      - 南投縣
      - 雲林縣
      - 嘉義縣
      - 嘉義市
      - 屏東縣
    optimistic: true
    entity_category: config
    web_server:
      sorting_group_id: forecast_group
      sorting_weight: 100
    on_value:
      - script.execute: validate_and_update_forecast

text:
  - platform: template
    id: forecast_api_key
    name: Forecast - API Key
    optimistic: true
    min_length: 0
    max_length: 50
    mode: text
    restore_value: true
    entity_category: config
    web_server:
      sorting_group_id: forecast_group
      sorting_weight: 100
    on_value:
      - script.execute: validate_and_update_forecast

  - platform: template
    id: town_name
    name: Forecast - Town Name
    optimistic: true
    min_length: 0
    max_length: 20
    mode: text
    restore_value: true
    entity_category: config
    web_server:
      sorting_group_id: forecast_group
      sorting_weight: 100
    on_value:
      - script.execute: validate_and_update_forecast

text_sensor:
  - platform: template
    id: project_website
    name: "Project Website"
    update_interval: never
    web_server:
      sorting_group_id: project_group

  - platform: template
    id: firmware_version
    name: "Firmware - Version"
    lambda: |-
      #ifdef ESPHOME_PROJECT_VERSION
        return {ESPHOME_PROJECT_VERSION};
      #else
        return {"Unknown"};
      #endif
    update_interval: never
    web_server:
      sorting_group_id: firmware_group
      sorting_weight: -3

  - platform: cwa_town_forecast
    mode: 3-DAYS
    cwa_town_forecast_id: town_forecast_3d
    last_updated:
      name: "3D Last Updated"
    last_success:
      name: "3D Last Success"
    last_error:
      name: "3D Last Error"

  - platform: cwa_town_forecast
    mode: 7-DAYS
    cwa_town_forecast_id: town_forecast_7d
    last_updated:
      name: "7D Last Updated"
    last_success:
      name: "7D Last Success"
    last_error:
      name: "7D Last Error"

switch:
  - platform: template
    name: "Schedule Reboot - Enabled"
    id: schedule_reboot_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    web_server:
      sorting_group_id: schedule_reboot_group
      sorting_weight: -1

  - platform: template
    name: "Firmware - Auto Update"
    id: firmware_auto_update
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    web_server:
      sorting_group_id: firmware_group
      sorting_weight: -4

button:
  - platform: template
    name: "Forecast - Update All"
    web_server:
      sorting_group_id: forecast_group
      sorting_weight: 10
    on_press:
      - script.execute:
          id: update_forecast_all
          update_display: true

  - platform: template
    name: "Firmware - Check"
    web_server:
      sorting_group_id: firmware_group
      sorting_weight: -1
    on_press:
      - if:
          condition:
            wifi.connected:
          then:
            - component.update: update_manager

  - platform: template
    name: "Firmware - Perform Update"
    web_server:
      sorting_group_id: firmware_group
    on_press:
      - if:
          condition:
            update.is_available: update_manager
          then:
            - update.perform: update_manager
          else:
            - logger.log:
                level: INFO
                format: "No new updates"

http_request:
  timeout: 10s
  watchdog_timeout: 30s
  verify_ssl: false

ota:
  - platform: http_request
    on_begin:
      then:
        - lambda: |-
            id(ota_in_progress) = true;
            auto now = id(esp_time).now();
            if (now.is_valid()) {
              id(ota_start_time) = now.strftime("%Y-%m-%d %H:%M:%S");
            } else {
              id(ota_start_time) = "Unknown";
            }
            id(fire_refresh_event)->execute();
    on_end:
      then:
        - lambda: |-
            id(ota_in_progress) = false;
            id(ota_start_time) = "";
    on_error:
      then:
        - lambda: |-
            id(ota_in_progress) = false;
            id(ota_start_time) = "";
            id(fire_refresh_event)->execute();

update:
  - platform: http_request
    id: update_manager
    name: Firmware
    source: $firmware_manifest_url
    web_server:
      sorting_group_id: firmware_group
      sorting_weight: -2

interval:
  # automatically update the firmware when it is available
  - interval: 1min
    then:
      if:
        condition:
          and:
            - wifi.connected:
            - switch.is_on: firmware_auto_update
            - update.is_available: update_manager
        then:
          - lambda: |-
              ESP_LOGI("update", "Firmware Auto Update");
              id(update_manager).perform(false);

datetime:
  - platform: template
    type: time
    name: Schedule Reboot - Time
    optimistic: yes
    initial_value: "$default_schedule_reboot_time"
    restore_value: true
    web_server:
      sorting_group_id: schedule_reboot_group
    on_time:
      - if:
          condition:
            switch.is_on: schedule_reboot_enabled
          then:
            - lambda: |-
                ESP_LOGI("main", "Reboot as scheduled");
            - button.press: restart_btn

