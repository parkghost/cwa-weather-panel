display:
  - platform: waveshare_epaper
    id: !extend my_display
    model: $display_model
    rotation: $display_rotation
    update_interval: $display_update_interval
    full_update_every: $display_full_update_every
    lambda: |-
      using namespace cwa_town_forecast;
      int width = it.get_width();
      int height = it.get_height();
      auto BLACK = Color(0, 0, 0, 0);
      auto RED = Color(255, 0, 0, 0);
      auto WHITE = Color(255, 255, 255, 0);
      if (it.get_display_type() == DisplayType::DISPLAY_TYPE_BINARY) {
        BLACK = COLOR_ON;
        WHITE = COLOR_OFF;
      } else if (it.get_display_type() == DisplayType::DISPLAY_TYPE_COLOR) {
        it.fill(WHITE);
      }

      if (id(display_white_screen).state) {
        return;
      }

      // Display version number in bottom right corner
      std::string version = id(firmware_version).state;
      if (!version.empty()) {
        it.printf(width - 10, height - 10, id(font_18), BLACK, TextAlign::BOTTOM_RIGHT, "v%s", version.c_str());
      }

      // Check WiFi configuration
      auto *wifi = id(wifi_id);
      if (wifi == nullptr || !wifi->has_sta()) {
        int y_pos = 20;
        it.print(width / 2, y_pos, id(title_font), $highlight_color, TextAlign::TOP_CENTER, "需要設定");
        y_pos += 50;
        it.print(width / 2, y_pos, id(font_24), BLACK, TextAlign::TOP_CENTER, "請設定 WiFi 連線");
        y_pos += 40;
        it.print(width / 2, y_pos, id(font_18), BLACK, TextAlign::TOP_CENTER, "Please configure WiFi settings");
        y_pos += 40;

        // Display AP mode connection info
        it.print(width / 2, y_pos, id(font_18), BLACK, TextAlign::TOP_CENTER, "連線至 Wifi AP:");
        y_pos += 30;
        it.print(width / 2, y_pos, id(font_18), $highlight_color, TextAlign::TOP_CENTER, "$friendly_name");
        y_pos += 30;
        it.print(width / 2, y_pos, id(font_18), BLACK, TextAlign::TOP_CENTER, "密碼: $wifi_ap_password");
        y_pos += 35;
        it.print(width / 2, y_pos, id(font_24), BLACK, TextAlign::TOP_CENTER, "設定網址: http://192.168.4.1");
        return;
      }

      if (!wifi->is_connected()) {
        int y_pos = height / 2 - 20;
        it.print(width / 2, y_pos, id(title_font), BLACK, TextAlign::CENTER, "WiFi 連線中");
        y_pos += 50;
        it.print(width / 2, y_pos, id(font_18), BLACK, TextAlign::CENTER, "WiFi Connecting");
        return;
      }

      // Check if OTA is in progress
      if (id(ota_in_progress)) {
        int y_pos = 20;
        it.print(width / 2, y_pos, id(title_font), $highlight_color, TextAlign::TOP_CENTER, "韌體更新中");
        y_pos += 60;
        it.print(width / 2, y_pos, id(font_24), BLACK, TextAlign::TOP_CENTER, "Firmware Update");
        y_pos += 50;
        it.print(width / 2, y_pos, id(font_24), BLACK, TextAlign::TOP_CENTER, "請勿關閉電源");
        y_pos += 40;
        it.print(width / 2, y_pos, id(font_18), BLACK, TextAlign::TOP_CENTER, "Do not turn off power");
        y_pos += 50;
        if (!id(ota_start_time).empty()) {
          it.print(width / 2, y_pos, id(font_18), BLACK, TextAlign::TOP_CENTER, "開始時間:");
          y_pos += 30;
          it.printf(width / 2, y_pos, id(font_18), BLACK, TextAlign::TOP_CENTER, "%s", id(ota_start_time).c_str());
        }
        return;
      }

      // Check if configuration is missing
      if (id(town_name).state.empty() || id(forecast_api_key).state.empty()) {
        int y_pos = 20;
        it.print(width / 2, y_pos, id(title_font), $highlight_color, TextAlign::TOP_CENTER, "需要設定");
        y_pos += 50;
        it.print(width / 2, y_pos, id(font_24), BLACK, TextAlign::TOP_CENTER, "請使用以下網址進行設定：");
        y_pos += 40;

        // Display IP address
        auto ip_addresses = id(wifi_id).get_ip_addresses();
        if (!ip_addresses.empty() && ip_addresses[0].is_set()) {
          char ip_buf[40];
          ip_addresses[0].str_to(ip_buf);
          it.printf(width / 2, y_pos, id(font_24), BLACK, TextAlign::TOP_CENTER, "http://%s", ip_buf);
          y_pos += 40;
        }

        // Display what needs to be configured
        y_pos += 10;
        it.print(width / 2, y_pos, id(font_18), BLACK, TextAlign::TOP_CENTER, "請設定以下項目：");
        y_pos += 30;

        it.print(width / 2, y_pos, id(font_18), $highlight_color, TextAlign::TOP_CENTER, "• 城市名稱 (Forecast - City Name)");
        y_pos += 25;

        if (id(town_name).state.empty()) {
          it.print(width / 2, y_pos, id(font_18), $highlight_color, TextAlign::TOP_CENTER, "• 鄉鎮名稱 (Forecast - Town Name)");
          y_pos += 25;
        }
        if (id(forecast_api_key).state.empty()) {
          it.print(width / 2, y_pos, id(font_18), $highlight_color, TextAlign::TOP_CENTER, "• 預報 API 金鑰 (Forecast - API Key)");
        }
        return;
      }

      auto now = id(esp_time).now();
      if (!now.is_valid()) {
        it.print(width / 2, height / 2, id(title_font), BLACK, TextAlign::CENTER, "Time Synchronization");
        return;
      }

      // Clear version number area with white background
      if (!id(firmware_version).state.empty()) {
        int version_width = 200;  // Estimated width for version text
        int version_height = 25;  // Estimated height for version text
        it.filled_rectangle(width - version_width - 10, height - version_height - 10, version_width, version_height, WHITE);
      }

      id(initial) = true;
      std::tm now_tm = now.to_c_tm();

      const auto &data_7d = id(town_forecast_7d).get_data();

      const std::map<std::string, std::string> ICON_NAME_TO_UNICODE_MAP {
        {"sunny","\U000F0599"},
        {"partly-cloudy","\U000F0595"},
        {"cloudy","\U000F0590"},
        {"pouring","\U000F0596"},
        {"partly-rainy","\U000F0F33"},
        {"rainy","\U000F0597"},
        {"lightning-rainy","\U000F067E"},
        {"partly-lightning","\U000F0F32"},
        {"snowy-rainy","\U000F067F"},
        {"fog","\U000F0591"},
        {"snowy","\U000F0598"},
        {"night","\U000F0594"},
        {"night-partly-cloudy","\U000F0F31"},
      };

      const std::map<std::string, bool> WEATHER_ICON_HIGHLIGHT {
        {"sunny", false},
        {"partly-cloudy", false},
        {"cloudy", false},
        {"pouring", true},
        {"partly-rainy", true},
        {"rainy", true},
        {"lightning-rainy", true},
        {"partly-lightning", true},
        {"snowy-rainy", true},
        {"fog", true},
        {"snowy", true},
        {"night", false},
        {"night-partly-cloudy", false},
      };

      const char *months[] = {"一", "二", "三", "四", "五", "六", "七", "八", "九", "十", "十一", "十二"};
      const char *weekdays[] = {"日", "一", "二", "三", "四", "五", "六"};

      int left_offset = 0;
      int top_offset = 0;
      int start_x = 0;
      int start_y = 0;

      // ###### top left section ######
      left_offset = 10;
      top_offset = 0;
      start_x = left_offset;
      start_y = top_offset;
      int block_width = 150;
      int block_height = 200;
      start_y += 5;
      it.printf(start_x + block_width / 2, start_y, id(month_font), $highlight_color, TextAlign::TOP_CENTER, "%s月", months[now_tm.tm_mon]);
      start_y += 55;
      it.printf(start_x + block_width / 2, start_y, id(date_font), $highlight_color, TextAlign::TOP_CENTER, "%d", now_tm.tm_mday);
      start_y += 100;
      it.printf(start_x + block_width / 2, start_y, id(week_font), $highlight_color, TextAlign::TOP_CENTER, "星期%s", weekdays[now.day_of_week - 1]);

      // ###### top right section ######
      left_offset = 150;
      top_offset = 0;
      start_x = left_offset;
      start_y = top_offset;
      block_width = width - left_offset;
      block_height = 200;
      std::string icon = data_7d.find_value(ElementValueKey::WEATHER_ICON, true, now_tm, ""); // default to empty string
      std::string unicode_icon = ICON_NAME_TO_UNICODE_MAP.find(icon) != ICON_NAME_TO_UNICODE_MAP.end() ? ICON_NAME_TO_UNICODE_MAP.find(icon)->second : std::string("");
      bool highlight = WEATHER_ICON_HIGHLIGHT.find(icon) != WEATHER_ICON_HIGHLIGHT.end() ? WEATHER_ICON_HIGHLIGHT.find(icon)->second : false;
      std::string min_temp = data_7d.find_value(ElementValueKey::MIN_TEMPERATURE, true, now_tm);
      std::string max_temp = data_7d.find_value(ElementValueKey::MAX_TEMPERATURE, true, now_tm);
      std::string pop_12 = data_7d.find_value(ElementValueKey::PROBABILITY_OF_PRECIPITATION, true, now_tm);
      std::string weather_desc = data_7d.find_value(ElementValueKey::WEATHER, true, now_tm);
      start_y -= 5;
      it.printf(start_x + block_width / 2, start_y, id(icon_weather_font), highlight ? $highlight_color : BLACK, TextAlign::TOP_CENTER, unicode_icon.c_str());
      start_y += 145;
      start_x += 18;
      it.printf(start_x, start_y + 3, id(icon_font), BLACK, TextAlign::TOP_LEFT, "\U000F050F");
      start_x += 25;
      it.printf(start_x, start_y, id(font_24), BLACK, TextAlign::TOP_LEFT, "%s-%s°C", min_temp.c_str(), max_temp.c_str());
      start_x += 110;
      it.printf(start_x, start_y + 2, id(icon_font), BLACK, TextAlign::TOP_LEFT, "\U000F0597");
      start_x += 30;
      it.printf(start_x, start_y, id(font_24), BLACK, TextAlign::TOP_LEFT, "%s%%", pop_12.c_str());
      start_x = left_offset;
      start_y += 30;
      it.printf(start_x + block_width / 2, start_y, id(weather_desc_font), BLACK, TextAlign::TOP_CENTER, weather_desc.c_str());

      // ###### bottom section ######
      left_offset = 0;
      top_offset = 200;
      it.line(0, top_offset, width, top_offset, BLACK);

      std::string mode = id(forecast_mode).current_option().str();
      if (mode == "7-Day Forecast") {
        // 7-day forecast mode
        int days = 7;
        int cell_w = (width - left_offset) / days;
        int cell_h = 100 / 3;

        auto day_start = now_tm;
        std::tm data_start_7d = data_7d.start_time;
        if (std::mktime(&day_start) < std::mktime(&data_start_7d)) {
          day_start = data_7d.start_time;
        }

        for (int d = 0; d < days; ++d) {
          // daytime
          std::tm noon = day_start;
          noon.tm_mday += d;
          noon.tm_hour = 12;
          noon.tm_min = 0;
          noon.tm_sec = 0;
          std::mktime(&noon);
          auto esp_noon = tm_to_esptime(noon);
          std::string icon = data_7d.find_value(ElementValueKey::WEATHER_ICON, false, noon, ""); // default to empty string
          std::string min_temp = data_7d.find_value(ElementValueKey::MIN_TEMPERATURE, false, noon);
          std::string max_temp = data_7d.find_value(ElementValueKey::MAX_TEMPERATURE, false, noon);

          // fallback if no data available
          if (d == 0) {
            std::string date_str = now.strftime("%Y%m%d");
            if (icon != "") {
              // cache the first day's data
              id(day_1_icon) = icon;
              id(day_1_min_temp) = min_temp;
              id(day_1_max_temp) = max_temp;
              id(day_1_date) = date_str;
            } else if (icon == "" && id(day_1_icon) != "" && id(day_1_date) == date_str) {
              // fallback to cached data if available
              icon = id(day_1_icon);
              min_temp = id(day_1_min_temp);
              max_temp = id(day_1_max_temp);
              ESP_LOGW("main", "Day 1: Fallback to cached data: icon=%s min_temp=%s max_temp=%s", icon.c_str(), min_temp.c_str(), max_temp.c_str());
            } else {
              // fallback to the first available data
              icon = data_7d.find_value(ElementValueKey::WEATHER_ICON, true, now_tm, ""); // default to empty string
              min_temp = data_7d.find_value(ElementValueKey::MIN_TEMPERATURE, true, now_tm);
              max_temp = data_7d.find_value(ElementValueKey::MAX_TEMPERATURE, true, now_tm);
              ESP_LOGW("main", "Day 1: Fallback to first available data: icon=%s min_temp=%s max_temp=%s", icon.c_str(), min_temp.c_str(), max_temp.c_str());
            }
          }

          std::string unicode_icon = ICON_NAME_TO_UNICODE_MAP.find(icon) != ICON_NAME_TO_UNICODE_MAP.end() ? ICON_NAME_TO_UNICODE_MAP.find(icon)->second : std::string("");
          bool highlight = WEATHER_ICON_HIGHLIGHT.find(icon) != WEATHER_ICON_HIGHLIGHT.end() ? WEATHER_ICON_HIGHLIGHT.find(icon)->second : false;
          start_x = left_offset;
          start_y = top_offset;
          it.printf(start_x + (d + 0.5) * cell_w, start_y + cell_h / 2, id(week_font_sm), BLACK, TextAlign::CENTER, "週%s", weekdays[noon.tm_wday]);
          start_y += cell_h + 3;
          it.printf(start_x + (d + 0.5) * cell_w, start_y + cell_h / 2, id(icon_weather_font_sm), highlight ? $highlight_color : BLACK, TextAlign::CENTER, unicode_icon.c_str());
          start_y += cell_h;
          it.printf(start_x + (d + 0.5) * cell_w, start_y + cell_h / 2, id(font_18), BLACK, TextAlign::CENTER, "%s·%s", min_temp.c_str(), max_temp.c_str());
        }
      } else if (mode == "18-Hour Forecast") {
        // 18-hour forecast mode
        const auto &data_3d = id(town_forecast_3d).get_data();
        int periods = 6;
        int cell_w = (width - left_offset) / periods;
        int cell_h = 100 / 3;

        // Determine starting time - use data start time if current time is before it
        std::tm start_time = now_tm;
        std::tm data_start_3d = data_3d.start_time;
        if (std::mktime(&start_time) < std::mktime(&data_start_3d)) {
          start_time = data_3d.start_time;
          ESP_LOGD("main", "3H forecast: using data start time instead of current time");
        }
        // Round to nearest 3-hour boundary
        start_time.tm_hour = (start_time.tm_hour / 3) * 3;
        start_time.tm_min = 0;
        start_time.tm_sec = 0;
        std::mktime(&start_time);

        for (int p = 0; p < periods; ++p) {
          std::tm period_time = start_time;
          period_time.tm_hour += p * 3;
          std::mktime(&period_time);

          std::string icon = data_3d.find_value(ElementValueKey::WEATHER_ICON, false, period_time, "");
          std::string pop = data_3d.find_value(ElementValueKey::PROBABILITY_OF_PRECIPITATION, false, period_time);

          std::string unicode_icon = ICON_NAME_TO_UNICODE_MAP.find(icon) != ICON_NAME_TO_UNICODE_MAP.end() ? ICON_NAME_TO_UNICODE_MAP.find(icon)->second : std::string("");
          bool highlight = WEATHER_ICON_HIGHLIGHT.find(icon) != WEATHER_ICON_HIGHLIGHT.end() ? WEATHER_ICON_HIGHLIGHT.find(icon)->second : false;

          start_x = left_offset;
          start_y = top_offset;
          // Time label
          it.printf(start_x + (p + 0.5) * cell_w, start_y + cell_h / 2, id(hour_font_sm), BLACK, TextAlign::CENTER, "%02dH", period_time.tm_hour);
          start_y += cell_h + 3;
          // Weather icon
          it.printf(start_x + (p + 0.5) * cell_w, start_y + cell_h / 2, id(icon_weather_font_sm), highlight ? $highlight_color : BLACK, TextAlign::CENTER, unicode_icon.c_str());
          start_y += cell_h;
          // Rain probability
          it.printf(start_x + (p + 0.5) * cell_w, start_y + cell_h / 2, id(font_18), BLACK, TextAlign::CENTER, "\U000F0597%2s%%", pop.c_str());
        }
      }
